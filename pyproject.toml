[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slack-notifications"
description = "A library to send notifications to Slack."
readme = {file = "README.md", content-type = "text/markdown"}
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
    "apppath>=1.0.9",
    "typer>=0.27.3",
    "requests>=2.34.0",
    "rich>=15.0.0",
    "python-dotenv>=1.2.4",
]

license = "Apache-2.0"
license-files = ["License.md", "Authors.md"]
authors = [{name = "Micha Grandel", email = "michagrandel@proton.me"}]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.9",
    "reuse>=1.2",
    "spdx-tools>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notifications"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
notify = "notifications.cli:main"

[tool.tox]
requires = ["tox>=4.22"]
env_list = ["py315", "py314", "py313", "py312", "py311", "lint", "type"]

[testenv]
runner = "uv"
